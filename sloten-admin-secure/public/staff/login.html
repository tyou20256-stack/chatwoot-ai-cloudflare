<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Staff Login — Sloten Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f4f6; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); width: 360px; }
  h1 { margin: 0 0 24px 0; font-size: 22px; color: #111827; }
  label { display: block; margin: 12px 0 6px; font-size: 14px; color: #374151; }
  input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
  button { width: 100%; margin-top: 20px; padding: 12px; background: #0f766e; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0d9488; }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  .note { margin-top: 16px; font-size: 12px; color: #6b7280; line-height: 1.5; }
  .error { color: #dc2626; background: #fee2e2; padding: 10px; border-radius: 6px; font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<main class="card">
  <h1><span aria-hidden="true">🔐</span> Staff Login</h1>
  <form id="loginForm">
    <label for="email">メールアドレス</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="password">パスワード</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="submitBtn">ログイン</button>
    <div id="error" class="error" role="alert" aria-live="assertive" tabindex="-1"></div>
  </form>
  <div class="note">
    スロ天管理画面へようこそ。認証情報は管理者から発行されます。パスワードをお忘れの場合は管理者へお問い合わせください。
  </div>
</main>
<script>
const form = document.getElementById('loginForm');
const errorEl = document.getElementById('error');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.style.display = 'none';
  submitBtn.disabled = true;
  submitBtn.textContent = 'ログイン中...';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const d = await r.json();
    if (r.ok && d.success) {
      localStorage.setItem('staffName', d.staff.name);
      localStorage.setItem('staffRole', d.staff.role);
      localStorage.setItem('staffToken', 'cookie-based');
      window.location.href = '/';
    } else {
      errorEl.textContent = d.error || 'ログインに失敗しました';
      errorEl.style.display = 'block';
      if (r.status === 423) {
        errorEl.textContent = 'アカウントがロックされています。15分後に再試行してください。';
      }
      errorEl.focus();
    }
  } catch (err) {
    errorEl.textContent = 'ネットワークエラー: ' + err.message;
    errorEl.style.display = 'block';
    errorEl.focus();
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'ログイン';
  }
});
</script>
</body>
</html>
