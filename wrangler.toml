name = "chatwoot-ai-gateway"
main = "src/index.mjs"
compatibility_date = "2024-03-01"
workers_dev = true

[ai]
binding = "AI"

[vars]
DEPOSIT_PAGE_URL = "https://sloten.io/deposit"
PUBLIC_WORKER_URL = "https://chatwoot-ai-gateway.koni-tanaka.workers.dev"

# ============================================
# Production (default / top-level)
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "chatwoot_rag_db"
database_id = "fa4ab2dc-6180-4c5d-bb0d-45e3bc05cee0"

[[kv_namespaces]]
binding = "RATE_LIMITER"
id = "54d595365c154644a376ac0c83ebb561"

[[kv_namespaces]]
binding = "STATE_KV"
id = "2557f8891eff4340bcc4b812c78e4824"

# R2 bucket for uploaded files. If binding is absent, files handler
# falls back to a metadata-only stub (r2_key = 'stub://not-implemented').
# [[r2_buckets]]
# binding = "FILES_R2"
# bucket_name = "sloten-files"
# preview_bucket_name = "sloten-files-preview"

# ============================================
# Staging
# ============================================
[env.staging]
name = "chatwoot-ai-gateway-staging"

[env.staging.ai]
binding = "AI"

[env.staging.vars]
DEPOSIT_PAGE_URL = "https://staging.sloten.io/deposit"
PUBLIC_WORKER_URL = "https://chatwoot-ai-gateway-staging.workers.dev"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "chatwoot_rag_db_staging"
database_id = "REPLACE_WITH_STAGING_D1_ID"

[[env.staging.kv_namespaces]]
binding = "RATE_LIMITER"
id = "REPLACE_WITH_STAGING_KV_ID"

[[env.staging.kv_namespaces]]
binding = "STATE_KV"
id = "REPLACE_WITH_STAGING_STATE_KV_ID"

[[env.staging.r2_buckets]]
# binding = "FILES_R2"
bucket_name = "sloten-files-staging"

# ============================================
# Cron Triggers (retention)
# ============================================
[triggers]
crons = ["0 3 * * *", "0 * * * *"]   # Daily 03:00 UTC retention purge + hourly heartbeat check (ι4)

# ============================================
# Build / rules
# ============================================
[build]
command = ""

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false
